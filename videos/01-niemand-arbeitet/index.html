<!doctype html>
<html lang="de" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <script>
      // Die 3D-Welt lädt als Modul; HyperFrames wartet auf dieses Versprechen.
      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady.welt = new Promise((resolve) => (window.__weltReady = resolve));
      window.addEventListener("hf-seek", (e) => (window.__weltLastSeek = e.detail.time));
    </script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #111111;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        background: #111111;
      }
      #welt {
        position: absolute;
        inset: 0;
      }
      #welt-canvas {
        width: 1080px;
        height: 1920px;
        display: block;
      }
      #vignette {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background:
          radial-gradient(ellipse 85% 70% at 50% 45%, rgba(0, 0, 0, 0) 55%, rgba(0, 0, 0, 0.38) 100%),
          linear-gradient(180deg, rgba(0, 0, 0, 0.18) 0%, rgba(0, 0, 0, 0) 18%, rgba(0, 0, 0, 0) 30%, rgba(0, 0, 0, 0.3) 44%, rgba(0, 0, 0, 0.34) 52%, rgba(0, 0, 0, 0.3) 66%, rgba(0, 0, 0, 0.12) 74%, rgba(0, 0, 0, 0.3) 100%);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="30"
      data-width="1080"
      data-height="1920"
    >
      <!-- 3D-Welt (Three.js, gezeichnet aus der Zeit) -->
      <div id="welt" class="clip" data-start="0" data-duration="26.5" data-track-index="0" style="z-index: 1">
        <canvas id="welt-canvas" width="1080" height="1920"></canvas>
      </div>
      <div id="vignette" class="clip" data-start="0" data-duration="26.5" data-track-index="1" data-layout-ignore style="z-index: 2"></div>

      <div
        id="hook"
        data-composition-id="hook"
        data-composition-src="compositions/hook.html"
        data-start="0"
        data-duration="2.6"
        data-track-index="2"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 3"
      ></div>
      <div
        id="zaehler"
        data-composition-id="zaehler"
        data-composition-src="compositions/zaehler.html"
        data-start="2.5"
        data-duration="24"
        data-track-index="3"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 4"
      ></div>
      <div
        id="untertitel"
        data-composition-id="untertitel"
        data-composition-src="compositions/untertitel.html"
        data-start="2.5"
        data-duration="24"
        data-track-index="4"
        data-track-kind="captions"
        data-width="1080"
        data-height="1920"
        style="z-index: 5"
      ></div>
      <div
        id="abspann"
        data-composition-id="abspann"
        data-composition-src="compositions/abspann.html"
        data-start="26.5"
        data-duration="3.5"
        data-track-index="5"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 6"
      ></div>

      <!-- Ton: Klangteppich, Umgebung pro Phase, Effekte auf sichtbaren Aktionen (erzeugt mit ton.py) -->

      <audio id="ton-stadt" class="clip" src="assets/audio/stadt.mp3" data-start="0" data-duration="9.5" data-track-index="11" data-volume="1"></audio>
      <audio id="ton-whoosh" class="clip" src="assets/audio/whoosh.mp3" data-start="5.39" data-duration="0.6" data-track-index="12" data-volume="0.6"></audio>
      <audio id="ton-leer" class="clip" src="assets/audio/leer.mp3" data-start="8" data-duration="9.8" data-track-index="13" data-volume="0.55"></audio>
      <audio id="ton-rollladen" class="clip" src="assets/audio/rollladen.mp3" data-start="8.55" data-duration="1.5" data-track-index="14" data-volume="0.7"></audio>
      <audio id="ton-ampel" class="clip" src="assets/audio/ampel.mp3" data-start="8.5" data-duration="11.1" data-track-index="15" data-volume="0.35"></audio>
      <audio id="ton-summen" class="clip" src="assets/audio/summen.mp3" data-start="8.5" data-duration="10.6" data-track-index="16" data-volume="0.2"></audio>
      <audio id="ton-muell" class="clip" src="assets/audio/muell.mp3" data-start="11.5" data-duration="6" data-track-index="17" data-volume="0.8"></audio>

      <audio id="ton-strom-aus" class="clip" src="assets/audio/strom-aus.mp3" data-start="19.05" data-duration="2.2" data-track-index="20" data-volume="1"></audio>
      <audio id="ton-impact" class="clip" src="assets/audio/impact-bass-1.mp3" data-start="18.98" data-duration="2.1" data-track-index="21" data-volume="0.45"></audio>
      <audio id="ton-natur" class="clip" src="assets/audio/natur.mp3" data-start="20.3" data-duration="3.6" data-track-index="22" data-volume="0.75"></audio>
      <audio id="ton-abend" class="clip" src="assets/audio/abend.mp3" data-start="23.3" data-duration="3.4" data-track-index="23" data-volume="0.5"></audio>
      <audio id="ton-klick" class="clip" src="assets/audio/click-soft.mp3" data-start="24.33" data-duration="0.37" data-track-index="24" data-volume="1"></audio>
      <audio id="ton-abspann" class="clip" src="assets/audio/whoosh-short.mp3" data-start="26.35" data-duration="0.6" data-track-index="25" data-volume="0.6"></audio>
    </div>
    <script type="module" src="assets/welt.js"></script>
    <script id="zaehler-uhr">
      // Zähler "Menschen bei der Arbeit": reine Funktion der Video-Zeit t (Sekunden)
      (function () {
        const START = 3512408311;
        const days = [
          [0, "Montag · 08:00 Uhr"],
          [8.5, "Tag 1"],
          [11.5, "Tag 3"],
          [14.5, "Tag 7"],
          [17.5, "Tag 12"],
          [20.5, "Tag 60"],
          [23.5, "Tag 61"],
        ];
        function value(t) {
          if (t < 5.5) return START + Math.max(0, t - 2.5) * 23; // tickt langsam hoch
          if (t < 8.1) return (START + 69) * Math.pow(1 - (t - 5.5) / 2.6, 2.6); // Absturz auf 0
          if (t < 24.45) return 0;
          return 1; // einer fängt wieder an
        }
        function draw(t) {
          const num = document.getElementById("z-num");
          const sub = document.getElementById("z-sub");
          if (!num || !sub) return;
          num.textContent = Math.round(value(t)).toLocaleString("de-DE");
          let s = days[0][1];
          for (const [at, label] of days) if (t >= at) s = label;
          sub.textContent = s;
        }
        window.addEventListener("hf-seek", (e) => draw(e.detail.time));
      })();
    </script>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
