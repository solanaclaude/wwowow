      window.__hf = window.__hf || {};

      window.__hf.buildReady.welt = new Promise((resolve) => (window.__weltReady = resolve));

        inset: 0;
      }
      #welt-canvas {
        width: 1080px;
        height: 1920px;
        display: block;
      }
      #vignette {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background:
          radial-gradient(ellipse 85% 70% at 50% 45%, rgba(0, 0, 0, 0) 55%, rgba(0, 0, 0, 0.38) 100%),

      }
    </style>

    <script id="zaehler-uhr">
      // Zähler "Menschen bei der Arbeit": reine Funktion der Video-Zeit t (Sekunden)
      (function () {
        // Abschnitte: [von, bis, Bezeichnung, Startwert, Endwert, Einheit]; dazwischen weich interpoliert
        const segs = [
          [3, 8.5, "Weltbevölkerung", 8231402117, 8231402180, ""],
          [8.5, 27, "Weltbevölkerung", 8231402180, 4091226540, "", 8.5, 9.9],
          [27, 31, "Morde pro Jahr · weltweit", 458000, 45800, ""],
          [31, 35, "Frauen in Parlamenten", 27, 100, " %"],
          [35, 39, "Frauen in Führungspositionen", 28, 100, " %"],
          [39, 43, "Lohnlücke · Deutschland", 16, 0, " %"],
          [43, 51, "Versuche im Labor", 1, 4611, ""],
          [51, 59, "Weltbevölkerung", 3752381904, 3752381904, ""],
        ];
        const days = [
          [0, "Dienstag · 09:13 Uhr"], [8.5, "Dienstag · 09:14 Uhr"], [11, "Dienstag · 09:20 Uhr"],
          [15, "Tag 1"], [19, "Tag 3"], [23, "Woche 2"], [27, "Monat 1"], [31, "Monat 3"],
          [35, "Jahr 1"], [39, "Jahr 3"], [43, "Jahr 5"], [47, "Jahr 8"], [51, "Jahr 12"],
        ];
        function seg(t) {
          for (const sg of segs) if (t < sg[1]) return sg;
          return segs[segs.length - 1];
        }
        function value(t) {
          const [a, b, , v0, v1, , ra, rb] = seg(t);
          const u = Math.min(1, Math.max(0, (t - (ra ?? a)) / ((rb ?? b) - (ra ?? a))));
          const e = u * u * (3 - 2 * u);
          let v = v0 + (v1 - v0) * e;
          if (t >= 53.2 && t < 59) v += 1; // das erste Kind mit zwei Müttern
          return v;
        }
        function draw(t) {
          const num = document.getElementById("z-num");
          const sub = document.getElementById("z-sub");
          if (!num || !sub) return;
          const sg = seg(t);
          num.textContent = Math.round(value(t)).toLocaleString("de-DE") + sg[5];
          const lab = document.getElementById("z-label");
          if (lab) lab.textContent = sg[2];
          // beim Wechsel der Bezeichnung kurz ein- und ausblenden
          const since = t - sg[0], until = sg[1] - t;
          const op = sg[0] > 3 && since < 0.3 ? since / 0.3 : 1;
          for (const el of [lab, num]) if (el) el.style.opacity = String(Math.min(op, segs.indexOf(sg) < segs.length - 1 && until < 0.15 && segs[segs.indexOf(sg) + 1][2] !== sg[2] ? until / 0.15 : 1));
          let s = days[0][1];
          for (const [at, label] of days) if (t >= at) s = label;
          sub.textContent = s;
        }
        window.addEventListener("hf-seek", (e) => draw(e.detail.time));
      })();
    </script>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
